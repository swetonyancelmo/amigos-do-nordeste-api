spring:
  flyway:
    enabled: false
  datasource:
    # O H2 nao tem a extensao unaccent do Postgres (V1). O INIT cria um alias
    # UNACCENT em Java (classe de teste) para as consultas nativas de duplicata
    # rodarem aqui com o mesmo SQL de producao.
    url: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE ALIAS IF NOT EXISTS UNACCENT FOR 'br.org.amigosdonordeste.cadastro.suporte.UnaccentH2.unaccent'"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # Base de conhecimento da avaliação de vulnerabilidade (ADR-0010): sem
  # Flyway, o H2 recebe o conteúdo pela própria V16, depois que o Hibernate
  # cria as tabelas. Uma fonte só: o teste usa o mesmo dado da produção.
  sql:
    init:
      mode: always
      data-locations:
        - classpath:db/migration/V16__escala_coelho_savassi.sql
        - classpath:db/migration/V18__vulnerabilidade_criterios_para_leitura.sql
      encoding: UTF-8
  jpa:
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
