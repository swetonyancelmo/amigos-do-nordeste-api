spring:
  application:
    name: cadastro-familias-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cadastro}
    username: ${DATABASE_USUARIO:and}
    password: ${DATABASE_SENHA:and}

  jpa:
    open-in-view: false
    hibernate:
      # SEMPRE none. Schema muda por migração do Flyway, versionada no git —
      # é o que permite duas equipes evoluírem o banco sem derrubar o trabalho
      # da outra. Ver CONTRIBUTING.md.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: America/Recife

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:3333}
  # Atras de um proxy reverso (Render, Fly), o IP que a API enxerga e o do
  # proxy, e o limite de tentativas por IP viraria um limite global. Em
  # producao ligue "native": o Tomcat passa a ler X-Forwarded-For, mas so de
  # proxies confiaveis (remoteip abaixo). Sem proxy, deixe "none" — senao
  # qualquer cliente forja o proprio IP pelo cabecalho.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  tomcat:
    remoteip:
      # Regex dos IPs de proxy em que se confia, alem das faixas privadas que
      # o Tomcat ja considera internas. Vazio: so as faixas privadas.
      trusted-proxies: ${SERVER_PROXIES_CONFIAVEIS:}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Gere um por ambiente:  openssl rand -base64 48
    segredo: ${APP_JWT_SEGREDO:troque-isto-por-um-valor-aleatorio-de-no-minimo-32-bytes}
    validade-acesso: 15m
    validade-renovacao: 7d
  ativacao-agente:
    # Codigo de seis digitos: com 5 tentativas por minuto, varrer o espaco todo
    # levaria anos. Limite por IP, em memoria (ver LimitadorPorIp).
    max-tentativas: 5
    janela: 1m
  cors:
    origens: ${APP_CORS_ORIGENS:http://localhost:3000}
  # Em produção precisa ser true (o cookie só viaja em HTTPS).
  cookie-seguro: ${APP_COOKIE_SEGURO:false}
  usuario-inicial:
    email: swetony@gmail.com
    nome: ${APP_USUARIO_INICIAL_NOME:Associação Amigos do Nordeste}

logging:
  level:
    br.org.amigosdonordeste: INFO
